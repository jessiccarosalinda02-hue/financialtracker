<!DOCTYPE html>
<html lang="id" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Tracker</title>
<style>
:root{--bg:#e9edf6;--panel:#fff;--ink:#0f1b2d;--mute:#5b6a80;--line:#d6ddea;--acc:#1e3a8a;--onacc:#fff;--in:#0d8a67;--out:#d4455b;--warn:#d98a1c;--sh:0 1px 2px #0f1b2d12,0 10px 28px #0f1b2d0f;color-scheme:light}
[data-theme=light]{--bg:#f5f6f8;--ink:#171a20;--mute:#667080;--line:#e3e6eb;--acc:#2563eb}
[data-theme=dark]{--bg:#0b0f17;--panel:#131a26;--ink:#e8edf5;--mute:#8d9ab0;--line:#232e40;--acc:#7c9cff;--onacc:#0b0f17;--in:#3fc89f;--out:#ff7b8f;--warn:#f0b24a;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .25s,color .25s}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 80px}
@media(min-width:1400px){.wrap{max-width:1280px}}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.lo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--onacc);font-size:13px;font-weight:700}
h2{font-size:16px;font-weight:650;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:650;margin:14px 0 4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.us{color:var(--mute);font-size:13px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;transition:border-color .15s,transform .1s}
button:hover,.btn:hover{border-color:var(--acc)}
button:active{transform:scale(.97)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.bar input{width:auto}
label.btn{display:inline-block;color:var(--ink);font-size:15px}
.mn{display:flex;gap:4px}.mn button{padding:8px 12px}
.hero{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px;margin-bottom:22px}
.hero>div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.hero .big{background:var(--acc);color:var(--onacc);border-color:transparent}
.hero small{display:block;color:var(--mute)}
.hero .big small{color:inherit;opacity:.8}
.hero b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .big b{font-size:34px}
.h{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.in{color:var(--in)}.out{color:var(--out)}
.accs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;opacity:.85}
.grid{display:grid;grid-template-columns:minmax(300px,350px) minmax(0,1fr);gap:24px;align-items:stretch}
.sk{display:grid;gap:24px}
.rc{display:flex;flex-direction:column;gap:24px;min-width:0}
.rc .charts{margin-bottom:0}
.rc>.panel:last-child{flex:1}
@media(min-width:901px){.sk{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;scrollbar-width:thin;padding:6px;margin:-6px}}
@media(min-width:621px) and (max-width:900px){.sk{grid-template-columns:1fr 1fr;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
form{display:grid;gap:10px}
label{display:grid;gap:3px;color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut svg{width:140px;height:140px;flex:none}
.lg{list-style:none;margin:0;padding:0;font-size:13px;flex:1;min-width:130px}
.lg li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.br{margin-bottom:12px}.br>div:first-child{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.pb{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;border-radius:99px;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tools input[type=search]{flex:2 1 180px}.tools select{flex:1 1 120px;width:auto}
.ck{display:flex;align-items:center;gap:6px;white-space:nowrap}.ck input{width:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--mute);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
td small{color:var(--mute);display:block}
td button{padding:3px 8px;font-size:12px;margin-left:4px}
.tf{color:var(--mute);font-size:13px;margin-top:10px}
.scroll{overflow-x:auto}
svg text{fill:var(--mute);font-size:10px}
input[type=color]{width:40px;height:34px;padding:2px;flex:none;cursor:pointer}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:min(460px,92vw);padding:18px;max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.cr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.cr span{flex:1;min-width:0;overflow-wrap:anywhere}
.cr input.bd{width:104px;flex:none;padding:6px 8px;font-size:13px}.cr button{padding:4px 8px;font-size:12px}
.cf{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}.cf select,.cf input:not([type=color]){width:auto;flex:1 1 130px}
.wide{width:100%}
.tcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tc{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:8px;text-align:left;border-radius:12px}
.tc i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}
.tc[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#tcu{display:grid;gap:10px;margin-bottom:14px}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;padding:0;border-radius:50%}
.tcr{display:flex;gap:10px;align-items:center}.tcr select{width:auto;flex:1}
.tt{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:92vw}
.tt.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.tt button{background:none;border:0;padding:0;color:inherit;font-weight:700;text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:900px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:repeat(3,1fr)}.hero .big{grid-column:1/-1}}
@media(max-width:620px){.wrap{padding:12px 12px 80px}.charts{grid-template-columns:1fr}.bar{width:100%}.mn{flex:1}.mn input{flex:1}input,select{font-size:16px}button,.btn{padding:10px 12px}h1{font-size:20px}.hero{grid-template-columns:1fr 1fr}.hero>div{padding:12px}.hero .big b{font-size:28px}.hero b{font-size:17px}.hero>div:last-child{grid-column:1/-1}thead{display:none}tr{display:grid;grid-template-columns:48px 1fr auto;border-bottom:1px solid var(--line)}td{border:0;padding:8px 6px 4px}td:last-child{grid-column:1/-1;text-align:right;padding-top:0;padding-bottom:8px}.donut svg{margin:0 auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="lo" aria-hidden="true">Rp</span>Financial Tracker</h1>
  <div class="bar">
    <button id="thb">Tema</button>
    <div class="mn"><button id="pm" aria-label="Bulan sebelumnya">‹</button><input type="month" id="m" aria-label="Pilih bulan"><button id="nm" aria-label="Bulan berikutnya">›</button></div>
    <button id="lg" class="p" hidden>Masuk dengan Google</button><span id="us" class="us"></span>
    <button id="csv">Ekspor CSV</button>
    <button id="bk">Backup</button>
    <label class="btn">Restore<input type="file" id="rs" accept=".json" hidden></label>
  </div>
</header>

<section class="hero" id="hero"></section>

<div class="grid">
  <div class="side"><div class="sk">
  <div class="panel">
    <h2 id="ft">Transaksi baru</h2>
    <form id="f">
      <div class="two">
        <label>Tipe<select id="t"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select></label>
        <label>Tanggal<input type="date" id="d" required></label>
      </div>
      <label>Nominal (Rp)<input type="text" id="a" inputmode="decimal" autocomplete="off" placeholder="1.000.000" required></label>
      <label>Kategori<input id="c" list="cl" required placeholder="Pilih atau ketik baru"></label>
      <label>Akun<input id="ac" list="al" required placeholder="Tunai, Bank, E-Wallet..."></label>
      <label>Catatan<input id="n" placeholder="Opsional"></label>
      <datalist id="cl"></datalist><datalist id="al"></datalist>
      <button class="p" id="sb">Simpan transaksi</button>
      <button type="button" id="cx" hidden>Batal edit</button>
      <button type="button" id="mc">Kelola kategori &amp; warna</button>
    </form>
  </div>
  <div class="panel"><h2>Anggaran bulan ini</h2><div id="bud"></div></div>
  </div></div>

  <div class="rc">
    <div class="charts">
      <div class="panel"><h2>Per kategori <select id="dt" style="width:auto;margin-left:6px;font-size:13px"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select></h2><div id="donut"></div></div>
      <div class="panel"><h2>6 bulan terakhir</h2><div id="bars"></div></div>
    </div>
    <div class="panel">
      <h2>Riwayat transaksi</h2>
      <div class="tools">
        <input id="q" type="search" placeholder="Cari kategori, akun, atau catatan">
        <select id="fty" aria-label="Filter tipe"><option value="">Semua tipe</option><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select>
        <select id="fac" aria-label="Filter akun"></select>
        <label class="ck"><input type="checkbox" id="fall">Semua bulan</label>
      </div>
      <div class="scroll"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="r">Nominal</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
      <div class="tf" id="tf"></div>
    </div>
  </div>
</div>
</div>

<dialog id="dg">
  <h2>Kategori &amp; warna</h2>
  <p style="color:var(--mute);margin:0">Warna dipakai di chart. Isi anggaran bulanan pada kategori pengeluaran untuk memantau batasnya.</p>
  <div id="cm"></div>
  <form id="cf" class="cf"><select id="ct"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select><input id="cn" placeholder="Nama kategori baru" required><input type="color" id="cc" value="#2b3f9e" aria-label="Warna kategori"><button class="p">Tambah</button></form>
  <button type="button" id="cz" class="wide">Tutup</button>
</dialog>

<dialog id="thd">
  <h2>Tema</h2>
  <div class="tcs" id="tl">
    <button type="button" class="tc" data-k="default"><i style="background:linear-gradient(135deg,#14275e,#1e3a8a)"></i>Default (navy)</button>
    <button type="button" class="tc" data-k="light"><i style="background:linear-gradient(135deg,#f5f6f8 60%,#2563eb 60%)"></i>Terang</button>
    <button type="button" class="tc" data-k="dark"><i style="background:linear-gradient(135deg,#131a26 60%,#7c9cff 60%)"></i>Gelap</button>
    <button type="button" class="tc" data-k="custom"><i></i>Custom</button>
  </div>
  <div id="tcu" hidden>
    <div class="tcr"><input type="color" id="tcol" aria-label="Warna utama"><span class="sws" id="tsw"></span></div>
    <label class="tcr">Mode<select id="tmo"><option value="light">Terang</option><option value="dark">Gelap</option></select></label>
  </div>
  <button type="button" id="thz" class="wide">Tutup</button>
</dialog>

<div class="tt" id="tt" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const ym=d=>d.slice(0,7);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mk=(m,n)=>{const [y,o]=m.split('-').map(Number),d=new Date(y,o-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const P=['#2b3f9e','#e0a030','#d4455b','#0d8a67','#8a5fa8','#4a9fd6','#c46e9b','#8c8c7a'];
const DC={out:['Makanan','Transport','Belanja','Tagihan','Hiburan','Kesehatan','Pendidikan','Lainnya'],in:['Gaji','Bonus','Usaha','Saldo awal','Lainnya']};
const DA=['Tunai','Bank','E-Wallet'];
const MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const uniq=a=>[...new Set(a)];

let S;try{S=JSON.parse(localStorage.getItem('ft1'))}catch(e){}
if(!S||!Array.isArray(S.tx))S={tx:[]};
const catOf=(t,n)=>S.cats.find(x=>x.t===t&&x.n===n);
const colOf=(t,n)=>(catOf(t,n)||{}).c||'#8c8c7a';
function initCats(){
  if(!Array.isArray(S.cats)){S.cats=[];['out','in'].forEach(t=>DC[t].forEach(n=>S.cats.push({n,t,c:''})))}
  S.tx.forEach(x=>{if(!catOf(x.t,x.c))S.cats.push({n:x.c,t:x.t,c:''})});
  ['out','in'].forEach(t=>S.cats.filter(x=>x.t===t&&!x.c).forEach(x=>x.c=P[S.cats.filter(y=>y.t===t&&y.c).length%P.length]));
}
function ensureCat(t,n){if(!catOf(t,n)){S.cats.push({n,t,c:''});initCats()}}
initCats();
const save=()=>{S.u=Date.now();try{localStorage.setItem('ft1',JSON.stringify(S))}catch(e){alert('Gagal menyimpan ke browser. Gunakan tombol Backup.')}push()};

/* ===== Sinkron Firebase (opsional) ===== */
const FB={apiKey:"AIzaSyBSBxcjww0fpMD8hToqm_GU428ItJmzTjI",authDomain:"financial-tracker-6225.firebaseapp.com",projectId:"financial-tracker-6225",appId:"1:937777362661:web:e39412d75c7bd9376ec60c"};
let fdb=null,fu=null,fsub=null,syn=false,pt;
const st=t=>{$('#us').textContent=t};
function fbInit(){
  if(!FB.apiKey||typeof firebase==='undefined')return;
  firebase.initializeApp(FB);fdb=firebase.firestore();$('#lg').hidden=false;
  firebase.auth().onAuthStateChanged(u=>{
    fu=u;syn=false;if(fsub){fsub();fsub=null}
    $('#lg').textContent=u?'Keluar':'Masuk dengan Google';
    st(u?(u.displayName||u.email):'');
    if(u)listen();
  });
}
function push(){
  if(!fu||!fdb)return;
  clearTimeout(pt);
  pt=setTimeout(()=>{S.u=S.u||Date.now();fdb.doc('users/'+fu.uid).set({data:JSON.stringify(S),u:S.u}).then(()=>st((fu.displayName||fu.email)+' · tersinkron')).catch(e=>st('Gagal sinkron: '+e.code))},700);
}
function listen(){
  fsub=fdb.doc('users/'+fu.uid).onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(!snap.exists){push();return}
    const r=snap.data();if(r.u===S.u)return;
    const rd=JSON.parse(r.data),first=!syn;syn=true;
    let use=first||r.u>S.u;
    if(first&&S.tx.length)use=rd.tx.length?confirm('Di cloud ada '+rd.tx.length+' transaksi, di perangkat ini '+S.tx.length+'.\nOK = pakai data cloud\nBatal = timpa cloud dengan data perangkat ini'):false;
    if(!use){if(first)push();return}
    S=rd;initCats();try{localStorage.setItem('ft1',JSON.stringify(S))}catch(e){}
    lists();render();st((fu.displayName||fu.email)+' · tersinkron');
  },e=>st('Gagal sinkron: '+e.code));
}
$('#lg').onclick=()=>fu?firebase.auth().signOut():firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert('Login gagal: '+e.code));
let ed=null,tmr;

function toast(m,a,fn){
  const t=$('#tt');t.innerHTML='<span>'+esc(m)+'</span>'+(a?'<button>'+esc(a)+'</button>':'');t.classList.add('on');
  if(a)t.querySelector('button').onclick=()=>{fn();t.classList.remove('on')};
  clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('on'),a?6000:2500);
}

/* ===== Input nominal ===== */
function formatAmount(value){
  const clean=String(value).replace(/[^0-9,]/g,'');
  if(!clean)return '';
  const p=clean.split(','),i=p[0].replace(/^0+(?=\d)/,'')||'0';
  return i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(p.length>1?','+p.slice(1).join(''):'');
}
function parseAmount(v){return Number(String(v).replace(/\./g,'').replace(',','.'))}
function storedAmount(v){return Number(v).toLocaleString('id-ID',{useGrouping:true,maximumFractionDigits:20})}
const amountInput=$('#a');
amountInput.addEventListener('input',()=>{
  const raw=amountInput.value,pos=amountInput.selectionStart??raw.length;
  const right=raw.slice(pos).replace(/[^0-9,]/g,'').length;
  const formatted=formatAmount(raw);amountInput.value=formatted;
  let caret=formatted.length,rem=right;
  while(caret>0&&rem>0){caret--;if(/[0-9,]/.test(formatted[caret]))rem--}
  amountInput.setSelectionRange(caret,caret);
  const n=parseAmount(formatted);
  amountInput.setCustomValidity(formatted&&(!Number.isFinite(n)||n<=0)?'Nominal harus lebih dari 0.':'');
});
amountInput.addEventListener('keydown',e=>{
  if(e.key==='Backspace'&&amountInput.selectionStart===amountInput.selectionEnd){
    const p=amountInput.selectionStart;
    if(p>0&&amountInput.value[p-1]==='.')amountInput.setSelectionRange(p-1,p-1);
  }
  if(e.key==='Delete'&&amountInput.selectionStart===amountInput.selectionEnd){
    const p=amountInput.selectionStart;
    if(amountInput.value[p]==='.')amountInput.setSelectionRange(p+1,p+1);
  }
});

/* ===== Tema: default (navy), terang, gelap, custom ===== */
const TV=['--bg','--panel','--ink','--mute','--line','--acc','--onacc','--in','--out'];
const h2hsl=h=>{const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,s=d?d/(1-Math.abs(2*l-1)):0;let hh=0;if(d){hh=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60}return[Math.round(hh),s*100,l*100]};
const lum=h=>{const c=[1,3,5].map(i=>{const v=parseInt(h.slice(i,i+2),16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
function cv(c,m){
  const [h,s,l]=h2hsl(c),q=Math.round(Math.min(s,60)*.5);
  if(m==='dark')return{'--bg':`hsl(${h} ${q}% 8%)`,'--panel':`hsl(${h} ${q}% 12%)`,'--ink':`hsl(${h} ${q}% 94%)`,'--mute':`hsl(${h} 12% 63%)`,'--line':`hsl(${h} ${q}% 21%)`,'--acc':`hsl(${h} ${Math.max(s,45)}% ${Math.min(Math.max(l,62),74)}%)`,'--onacc':'#0b0f17','--in':'#3fc89f','--out':'#ff7b8f'};
  return{'--bg':`hsl(${h} ${q}% 96%)`,'--panel':'#fff','--ink':`hsl(${h} ${q}% 13%)`,'--mute':`hsl(${h} 10% 42%)`,'--line':`hsl(${h} ${q}% 89%)`,'--acc':c,'--onacc':lum(c)>.4?'#111':'#fff','--in':'#0d8a67','--out':'#d4455b'};
}
const SWS=['#e0457b','#8b5cf6','#14b8a6','#f97316','#16a34a','#dc2626','#0ea5e9'];
$('#tsw').innerHTML=SWS.map(c=>`<button type="button" class="sw" data-c="${c}" style="background:${c}" aria-label="Warna ${c}"></button>`).join('');
let T={k:'default',c:'#e0457b',m:'light'};
try{Object.assign(T,JSON.parse(localStorage.getItem('ft-theme2')))}catch(e){}
function applyTheme(){
  if(!['default','light','dark','custom'].includes(T.k))T.k='default';
  if(!/^#[0-9a-f]{6}$/i.test(T.c))T.c='#e0457b';
  if(T.m!=='dark')T.m='light';
  const r=document.documentElement;r.dataset.theme=T.k;
  TV.forEach(v=>r.style.removeProperty(v));r.style.removeProperty('color-scheme');
  if(T.k==='custom'){Object.entries(cv(T.c,T.m)).forEach(([a,b])=>r.style.setProperty(a,b));r.style.colorScheme=T.m}
  $('#tcu').hidden=T.k!=='custom';
  document.querySelectorAll('.tc').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===T.k));
  $('.tc[data-k=custom] i').style.background=`linear-gradient(135deg,${T.m==='dark'?'#131a26':'#fff'} 40%,${T.c} 40%)`;
  $('#tcol').value=T.c;$('#tmo').value=T.m;
  try{localStorage.setItem('ft-theme2',JSON.stringify(T))}catch(e){}
}
applyTheme();
$('#thb').onclick=()=>$('#thd').showModal();
$('#thz').onclick=()=>$('#thd').close();
$('#tl').onclick=e=>{const b=e.target.closest('.tc');if(b){T.k=b.dataset.k;applyTheme()}};
$('#tcol').oninput=e=>{T.c=e.target.value;applyTheme()};
$('#tsw').onclick=e=>{const b=e.target.closest('[data-c]');if(b){T.c=b.dataset.c;applyTheme()}};
$('#tmo').onchange=e=>{T.m=e.target.value;applyTheme()};
['#dg','#thd'].forEach(s=>$(s).addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()}));

/* ===== Daftar & form ===== */
function lists(){
  const t=$('#t').value;
  $('#cl').innerHTML=S.cats.filter(x=>x.t===t).map(x=>x.n).map(c=>`<option value="${esc(c)}">`).join('');
  const as=uniq([...DA,...S.tx.map(x=>x.ac)]);
  $('#al').innerHTML=as.map(c=>`<option value="${esc(c)}">`).join('');
  const cur=$('#fac').value;
  $('#fac').innerHTML='<option value="">Semua akun</option>'+as.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  $('#fac').value=cur;
}
function reset(){ed=null;$('#f').reset();$('#a').setCustomValidity('');$('#d').value=today();$('#sb').textContent='Simpan transaksi';$('#ft').textContent='Transaksi baru';$('#cx').hidden=true;lists()}

const sum=(a,t)=>a.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
const dl=(c,p)=>p?`${c>=p?'↑':'↓'} ${Math.round(Math.abs(c-p)/p*100)}% dari bulan lalu`:'';

function render(){
  let m=$('#m').value;if(!m){m=ym(today());$('#m').value=m}
  const all=S.tx,mt=all.filter(x=>ym(x.d)===m);
  const pv=all.filter(x=>ym(x.d)===mk(m,-1));
  const inc=sum(mt,'in'),out=sum(mt,'out'),bal=sum(all,'in')-sum(all,'out');
  const [y,mo]=m.split('-').map(Number);
  const days=m===ym(today())?+today().slice(8):new Date(y,mo,0).getDate();
  const rate=inc>0?Math.round((inc-out)/inc*100):null;
  const acc={};all.forEach(x=>acc[x.ac]=(acc[x.ac]||0)+(x.t==='in'?x.a:-x.a));
  $('#hero').innerHTML=
    `<div class="big"><small>Total saldo</small><b>${R(bal)}</b><div class="accs">${Object.entries(acc).map(([k,v])=>`<span>${esc(k)} ${R(v)}</span>`).join('')}</div></div>`+
    `<div><small>Pemasukan bulan ini</small><b class="in">${R(inc)}</b><span class="h">${dl(inc,sum(pv,'in'))}</span></div>`+
    `<div><small>Pengeluaran bulan ini</small><b class="out">${R(out)}</b><span class="h">${[dl(out,sum(pv,'out')),out?'±'+R(out/days)+'/hari':''].filter(Boolean).join(' · ')}</span></div>`+
    `<div><small>Selisih bulan ini</small><b class="${inc-out<0?'out':'in'}">${R(inc-out)}</b><span class="h">${rate===null?'':'Menabung '+rate+'% dari pemasukan'}</span></div>`;

  // donut
  const dt=$('#dt').value,tot=dt==='out'?out:inc;
  const cs={};mt.filter(x=>x.t===dt).forEach(x=>cs[x.c]=(cs[x.c]||0)+x.a);
  const ce=Object.entries(cs).sort((a,b)=>b[1]-a[1]);
  if(!ce.length)$('#donut').innerHTML='<div class="empty">Belum ada data di bulan ini.</div>';
  else{
    const C=2*Math.PI*40;let off=0;
    const arcs=ce.map(([k,v])=>{const l=v/tot*C;const s=`<circle r="40" cx="70" cy="70" fill="none" stroke="${colOf(dt,k)}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return s}).join('');
    $('#donut').innerHTML=`<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Donut ${dt==='out'?'pengeluaran':'pemasukan'} per kategori">${arcs}</svg><ul class="lg">${ce.map(([k,v])=>`<li><span><i class="dot" style="background:${colOf(dt,k)}"></i>${esc(k)}</span><span>${Math.round(v/tot*100)}%</span></li>`).join('')}</ul></div>`;
  }

  // bars 6 bulan (klik batang untuk pindah bulan)
  const ms=[];
  for(let i=5;i>=0;i--){const k=mk(m,-i),a=all.filter(x=>ym(x.d)===k);ms.push({k,l:MN[+k.slice(5)-1],i:sum(a,'in'),o:sum(a,'out')})}
  const mx=Math.max(1,...ms.flatMap(x=>[x.i,x.o]));
  $('#bars').innerHTML=`<svg viewBox="0 0 300 150" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir">`+
    ms.map((x,j)=>{const hi=x.i/mx*110,ho=x.o/mx*110,bx=j*50+8;
      return `<g data-k="${x.k}" style="cursor:pointer"><rect x="${bx-4}" y="0" width="42" height="140" fill="transparent"/><rect x="${bx}" y="${120-hi}" width="16" height="${hi}" rx="2" fill="var(--in)"><title>${x.l} masuk ${R(x.i)}</title></rect><rect x="${bx+18}" y="${120-ho}" width="16" height="${ho}" rx="2" fill="var(--out)"><title>${x.l} keluar ${R(x.o)}</title></rect><text x="${bx+17}" y="136" text-anchor="middle"${x.k===m?' style="font-weight:700;fill:var(--ink)"':''}>${x.l}</text></g>`}).join('')+
    `<line x1="0" y1="120" x2="300" y2="120" stroke="var(--line)"/></svg><div class="accs"><span class="in">■ Pemasukan</span><span class="out">■ Pengeluaran</span></div>`;

  // anggaran
  const bs=S.cats.filter(x=>x.t==='out'&&x.b>0);
  $('#bud').innerHTML=bs.length?bs.map(x=>{
    const sp=mt.filter(y=>y.t==='out'&&y.c===x.n).reduce((s,y)=>s+y.a,0),p=sp/x.b,cl=p>1?'var(--out)':p>=.8?'var(--warn)':'var(--in)';
    return `<div class="br"><div><span><i class="dot" style="background:${x.c}"></i>${esc(x.n)}</span><span>${R(sp)} / ${R(x.b)}${p>1?' · lebih '+R(sp-x.b):''}</span></div><div class="pb"><i style="width:${Math.min(100,p*100)}%;background:${cl}"></i></div></div>`}).join(''):
    '<div class="empty">Belum ada anggaran. Atur lewat “Kelola kategori &amp; warna”.</div>';

  // tabel
  const q=$('#q').value.trim().toLowerCase(),ty=$('#fty').value,fa=$('#fac').value,al=$('#fall').checked;
  const rows=(al?all:mt).filter(x=>(!ty||x.t===ty)&&(!fa||x.ac===fa)&&(!q||[x.c,x.ac,x.n].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  $('#tb').innerHTML=rows.length?rows.map(x=>`<tr><td>${x.d.slice(8)}/${x.d.slice(5,7)}${al?'/'+x.d.slice(2,4):''}</td><td>${esc(x.c)}<small>${esc(x.ac)}${x.n?' · '+esc(x.n):''}</small></td><td class="r ${x.t}">${x.t==='in'?'+':'−'}${R(x.a)}</td><td class="r"><button data-a="ed" data-id="${x.id}">Edit</button><button data-a="dup" data-id="${x.id}">Salin</button><button data-a="del" data-id="${x.id}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Tidak ada transaksi. Tambahkan lewat form di samping.</td></tr>';
  $('#tf').textContent=rows.length?`${rows.length} transaksi · Masuk ${R(sum(rows,'in'))} · Keluar ${R(sum(rows,'out'))}`:'';
}

$('#f').onsubmit=e=>{
  e.preventDefault();
  const o={d:$('#d').value,t:$('#t').value,a:parseAmount($('#a').value),c:$('#c').value.trim(),ac:$('#ac').value.trim(),n:$('#n').value.trim()};
  if(!Number.isFinite(o.a)||!(o.a>0)||!o.c||!o.ac||!o.d)return;
  ensureCat(o.t,o.c);
  const was=ed;
  if(ed)Object.assign(S.tx.find(x=>x.id===ed),o);else S.tx.push({id:Date.now(),...o});
  save();$('#m').value=ym(o.d);reset();render();toast(was?'Transaksi diperbarui':'Transaksi disimpan');
};
$('#cx').onclick=reset;
$('#t').onchange=lists;
$('#m').onchange=$('#q').oninput=$('#dt').onchange=$('#fty').onchange=$('#fac').onchange=$('#fall').onchange=render;
$('#pm').onclick=()=>{$('#m').value=mk($('#m').value||ym(today()),-1);render()};
$('#nm').onclick=()=>{$('#m').value=mk($('#m').value||ym(today()),1);render()};
$('#bars').onclick=e=>{const g=e.target.closest('[data-k]');if(g){$('#m').value=g.dataset.k;render()}};

function fill(x,d){$('#t').value=x.t;lists();$('#d').value=d;$('#a').value=storedAmount(x.a);$('#a').setCustomValidity('');$('#c').value=x.c;$('#ac').value=x.ac;$('#n').value=x.n;scrollTo(0,0)}
$('#tb').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=+b.dataset.id,i=S.tx.findIndex(y=>y.id===id),x=S.tx[i];
  if(b.dataset.a==='del'){
    S.tx.splice(i,1);save();if(ed===id)reset();render();
    toast('Transaksi dihapus','Urungkan',()=>{S.tx.push(x);save();render()});
  }else if(b.dataset.a==='dup'){
    ed=null;fill(x,today());$('#sb').textContent='Simpan transaksi';$('#ft').textContent='Transaksi baru';$('#cx').hidden=true;
    toast('Data disalin. Ubah seperlunya lalu simpan.');
  }else{
    ed=id;fill(x,x.d);$('#sb').textContent='Update transaksi';$('#ft').textContent='Edit transaksi';$('#cx').hidden=false;
  }
};

/* ===== Ekspor / backup / restore ===== */
function dlf(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
$('#csv').onclick=()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const r=[['Tanggal','Tipe','Kategori','Akun','Nominal','Catatan'],...[...S.tx].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[x.d,x.t==='in'?'Pemasukan':'Pengeluaran',x.c,x.ac,x.a,x.n])];
  dlf('transaksi-'+today()+'.csv','text/csv;charset=utf-8','\ufeff'+r.map(a=>a.map(q).join(',')).join('\n'));
};
$('#bk').onclick=()=>dlf('backup-keuangan-'+today()+'.json','application/json',JSON.stringify(S,null,1));
$('#rs').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;if(confirm('Ganti semua data sekarang dengan isi backup ('+d.tx.length+' transaksi)?')){S=d;initCats();save();reset();render()}}catch(x){alert('File backup tidak valid.')}e.target.value=''};
  r.readAsText(f);
};

/* ===== Kelola kategori & warna ===== */
function rc(){
  $('#cm').innerHTML=['out','in'].map(t=>`<h3>${t==='out'?'Pengeluaran':'Pemasukan'}</h3>`+S.cats.map((x,i)=>x.t===t?`<div class="cr"><input type="color" value="${x.c}" data-i="${i}" aria-label="Warna ${esc(x.n)}"><span>${esc(x.n)}</span>${t==='out'?`<input class="bd" inputmode="numeric" placeholder="Anggaran" value="${x.b?formatAmount(String(Math.round(x.b))):''}" data-b="${i}" aria-label="Anggaran bulanan ${esc(x.n)}">`:''}<button type="button" data-ren="${i}">Nama</button><button type="button" data-del="${i}">Hapus</button></div>`:'').join('')).join('');
}
$('#mc').onclick=()=>{rc();$('#dg').showModal()};
$('#cz').onclick=()=>$('#dg').close();
$('#cm').oninput=e=>{if(e.target.type==='color'){S.cats[+e.target.dataset.i].c=e.target.value;save();render()}};
$('#cm').onchange=e=>{
  const i=e.target.dataset.b;if(i===undefined)return;
  const v=Math.round(parseAmount(formatAmount(e.target.value)));
  S.cats[+i].b=v>0?v:0;e.target.value=v>0?formatAmount(String(v)):'';save();render();
};
$('#cm').onclick=e=>{
  const r=e.target.closest('[data-ren]');
  if(r){
    const x=S.cats[+r.dataset.ren],n=(prompt('Nama baru untuk kategori "'+x.n+'":',x.n)||'').trim();
    if(!n||n===x.n)return;
    if(catOf(x.t,n)){alert('Kategori sudah ada.');return}
    S.tx.forEach(y=>{if(y.t===x.t&&y.c===x.n)y.c=n});x.n=n;save();rc();lists();render();return;
  }
  const b=e.target.closest('[data-del]');if(!b)return;
  const i=+b.dataset.del,x=S.cats[i],n=S.tx.filter(y=>y.t===x.t&&y.c===x.n).length;
  if(n){alert('Kategori "'+x.n+'" masih dipakai '+n+' transaksi. Ubah atau hapus transaksinya dulu.');return}
  S.cats.splice(i,1);save();rc();lists();render();
};
$('#cf').onsubmit=e=>{
  e.preventDefault();
  const t=$('#ct').value,n=$('#cn').value.trim();if(!n)return;
  if(catOf(t,n)){alert('Kategori sudah ada.');return}
  S.cats.push({n,t,c:$('#cc').value});save();$('#cn').value='';rc();lists();
};

$('#m').value=ym(today());
reset();render();fbInit();
</script>
</body>
</html>
